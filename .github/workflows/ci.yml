name: CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: windows-latest
    env:
      MV_EVIDENCE_OUTPUT: ${{ github.workspace }}/test-results/mv-evidence
      MV_WINDOWS_TEST_OUTPUT: ${{ runner.temp }}/rpgmaker-event-dsl-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare pnpm
        run: corepack prepare pnpm@10.33.0 --activate

      - name: Setup pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: Verify built CLI with the minimal Windows Workspace
        run: pnpm --filter rpgmaker-event-dsl test:windows-baseline

      - name: Retain evidence and failed Windows sandboxes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-node-22-verification
          path: |
            test-results/
            ${{ env.MV_WINDOWS_TEST_OUTPUT }}/
          if-no-files-found: error
          include-hidden-files: true
